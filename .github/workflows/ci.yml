name: CI

on:
  push:
    branches: [main]
  pull_request:

# lint -> type check -> tests (unit + integration) -> coverage -> security checks.
# One job, ordered steps -> the order above is guaranteed by construction.
#
# Simpler than the original monorepo's backend CI: E2E now lives in
# cdis-deployment and drives a real deployed environment, so this
# workflow only needs a `cdis_test` database, never a seeded "dev" one.
jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          # Setting MYSQL_DATABASE directly to cdis_test means the
          # official image auto-grants MYSQL_USER full privileges on
          # it at container creation — no manual GRANT step needed.
          MYSQL_DATABASE: cdis_test
          MYSQL_USER: cdis
          MYSQL_PASSWORD: cdis_dev_password
          MYSQL_ROOT_PASSWORD: cdis_root_dev_password
        ports:
          - 3308:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pcdis_root_dev_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # generated/ is gitignored (a build artifact, not source) — a
      # fresh checkout has no Prisma Client until this runs.
      - name: Generate Prisma Client
        run: npx prisma generate

      # prisma.config.ts's seed command is `tsx --env-file=.env
      # prisma/seed.ts` — tsx's --env-file flag hard-fails if the file
      # doesn't literally exist, even though DATABASE_URL is already
      # in the shell env below. CI-only values, matching .env.example.
      - name: Write .env
        run: |
          cat > .env <<'EOF'
          NODE_ENV=test
          PORT=4000
          CORS_ORIGIN=http://localhost:5173
          DATABASE_URL=mysql://cdis:cdis_dev_password@localhost:3308/cdis_test
          JWT_ACCESS_SECRET=ci-only-secret-never-used-outside-github-actions
          JWT_ACCESS_EXPIRES_IN=15m
          REFRESH_TOKEN_EXPIRES_IN_DAYS=7
          BCRYPT_SALT_ROUNDS=4
          ACCOUNT_LOCKOUT_MAX_ATTEMPTS=5
          ACCOUNT_LOCKOUT_DURATION_MINUTES=15
          EOF

      - name: Prepare test database
        run: |
          npx prisma migrate deploy
          npx prisma db seed

      # ---- lint ----
      - name: Lint
        run: npm run lint

      # ---- type check ----
      - name: Type-check
        run: npm run build # "build" *is* `tsc --noEmit` — no compiled artifact ships; tsx runs source directly

      # ---- tests ----
      - name: Tests (unit + integration)
        run: npm run test:all

      # ---- coverage ----
      # Re-runs (unit only — vitest.config.ts's own scope) with
      # coverage instrumentation so a threshold failure shows up as
      # its own distinct stage rather than folded into "tests" above.
      - name: Coverage
        run: npm run test:coverage

      # ---- security checks ----
      - name: Audit dependencies
        run: npm audit --audit-level=high

  # Only runs after every quality gate above passes, and only for
  # pushes to main (never for PRs from forks, which can't safely hold
  # package-write credentials) — build once here, deploy the resulting
  # artifact everywhere else. Tagged by commit SHA, never only `latest`,
  # so a specific version can always be pinned and rolled back to.
  build-and-push:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/workgaurav1/cdis-backend:${{ github.sha }}
            ghcr.io/workgaurav1/cdis-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
